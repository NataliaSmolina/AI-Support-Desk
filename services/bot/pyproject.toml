# Telegram-бот поддержки. С worker общается только через базу данных.
[project]
name = "support-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "pydantic-settings>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_bot"]
