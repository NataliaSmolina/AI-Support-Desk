[project]
name = "support-worker"
version = "0.1.0"
description = "Worker: забирает тикеты из PostgreSQL и прогоняет пайплайн обработки"
requires-python = ">=3.12"
dependencies = [
    "ai-clients",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.0",
]

[project.scripts]
support-worker = "support_worker.main:main"

[tool.uv.sources]
ai-clients = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_worker"]