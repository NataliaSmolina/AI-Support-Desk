[project]
name = "kb-index"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ai-clients",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
    "asyncpg>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_index"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
