services:
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    platform: linux/amd64
    command: ["--model-id", "sentence-transformers/all-MiniLM-L6-v2", "--port", "80"]
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - tei-integration-models:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 300s

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: kb_index_it
      POSTGRES_PASSWORD: kb_index_it_secret
      POSTGRES_DB: kb_index_it
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - ../../../infra/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb_index_it -d kb_index_it"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  tei-integration-models: