# Необязательная конфигурация для RAG-проверки на Mac/CPU.
# docker compose -p ai-support-desk -f infra/tei/compose.yml -f evals/tei.rag.yml up -d tei
services:
  tei:
    command:
      - --model-id
      - BAAI/bge-m3
      - --port
      - "80"
      - --max-batch-tokens
      - "1024"
      - --max-batch-requests
      - "2"
