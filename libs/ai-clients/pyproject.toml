# Общая библиотека для обращения к моделям: TEI (числа, оценки) и LLM (тема, ответ).
# Используется сервисами worker и kb-index.
[project]
name = "ai-clients"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_clients"]
