# Корень проекта: объединяет все пакеты (libs/*, позже services/*) в один uv workspace.
# Сам корень кода не содержит, но через него запускаются тесты и проверки из evals/.
[project]
name = "support-desk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["ai-clients", "kb-index"]

[tool.uv]
package = false

[tool.uv.sources]
ai-clients = { workspace = true }
kb-index = { workspace = true }

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs"]
addopts = "--import-mode=importlib"
