[project]
name = "support-desk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ai-clients",
    "psycopg[binary]>=3.3.6",
    "support-bot",
    "support-worker",
    "kb-index",
]

[tool.uv]
package = false

[tool.uv.sources]
ai-clients = { workspace = true }
kb-index = { workspace = true }
support-bot = { workspace = true }
support-worker = { workspace = true }

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services"]
addopts = "--import-mode=importlib"